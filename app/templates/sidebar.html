<!-- Sidebar Navigation -->
<div class="col-lg-2 sidebar text-white p-0">
    <div class="p-4">
        <h5 class="mb-4">
            <i class="bi bi-person-check-fill me-2"></i>
            Presensi System
        </h5>
        <nav class="nav flex-column">
            <a class="nav-link text-white{% if request.endpoint == 'main.dashboard' %} active{% else %}-50{% endif %}" href="{{ url_for('main.dashboard') }}">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
            <a class="nav-link text-white{% if request.endpoint in ['main.mahasiswa', 'main.tambah_mahasiswa'] %} active{% else %}-50{% endif %}" href="{{ url_for('main.mahasiswa') }}">
                <i class="bi bi-people me-2"></i>Mahasiswa
            </a>
            <a class="nav-link text-white{% if request.endpoint in ['main.jadwal', 'main.tambah_jadwal'] %} active{% else %}-50{% endif %}" href="{{ url_for('main.jadwal') }}">
                <i class="bi bi-calendar-event me-2"></i>Jadwal
            </a>
            <a class="nav-link text-white{% if request.endpoint in ['main.presensi', 'main.ambil_presensi'] %} active{% else %}-50{% endif %}" href="{{ url_for('main.presensi') }}">
                <i class="bi bi-clipboard-check me-2"></i>Presensi
            </a>
            <a class="nav-link text-white{% if request.endpoint == 'main.presensi_face' or 'face_recognition' in request.endpoint %} active{% else %}-50{% endif %}" href="{{ url_for('main.presensi_face') }}">
                <i class="bi bi-camera me-2"></i>Face Recognition
            </a>
            <a class="nav-link text-white{% if request.endpoint in ['main.rekapitulasi_presensi', 'main.detail_rekapitulasi_presensi'] %} active{% else %}-50{% endif %}" href="{{ url_for('main.rekapitulasi_presensi') }}">
                <i class="bi bi-bar-chart-line me-2"></i>Rekapitulasi
            </a>
            <a class="nav-link text-white{% if request.endpoint == 'main.laporan_presensi' %} active{% else %}-50{% endif %}" href="{{ url_for('main.laporan_presensi') }}">
                <i class="bi bi-file-text me-2"></i>Laporan
            </a>
        </nav>
    </div>
    <div class="mt-auto p-4">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle me-2"></i>
                {{ session.username or 'Admin' }}
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
                <li><a class="dropdown-item" href="{{ url_for('main.logout') }}">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a></li>
            </ul>
        </div>
    </div>
</div>
