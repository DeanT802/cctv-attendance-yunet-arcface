<!-- Sidebar Navigation -->
<div class="col-lg-2 sidebar p-0 d-flex flex-column">
    <div class="p-4">
        <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-light border-opacity-10">
            <i class="bi bi-person-check-fill me-2 fs-4 text-warning"></i>
            <h5 class="mb-0 text-white">Presensi System</h5>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link{% if request.endpoint == 'main.dashboard' %} active{% endif %}" href="{{ url_for('main.dashboard') }}">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
            <a class="nav-link{% if request.endpoint in ['main.mahasiswa', 'main.tambah_mahasiswa'] %} active{% endif %}" href="{{ url_for('main.mahasiswa') }}">
                <i class="bi bi-people me-2"></i>Mahasiswa
            </a>
            <a class="nav-link{% if request.endpoint in ['main.jadwal', 'main.tambah_jadwal'] %} active{% endif %}" href="{{ url_for('main.jadwal') }}">
                <i class="bi bi-calendar-event me-2"></i>Jadwal
            </a>
            <a class="nav-link{% if request.endpoint in ['main.presensi', 'main.ambil_presensi'] %} active{% endif %}" href="{{ url_for('main.presensi') }}">
                <i class="bi bi-clipboard-check me-2"></i>Presensi
            </a>
            <a class="nav-link{% if request.endpoint == 'main.presensi_face' or 'face_recognition' in request.endpoint %} active{% endif %}" href="{{ url_for('main.presensi_face') }}">
                <i class="bi bi-camera me-2"></i>Face Recognition
            </a>
            <a class="nav-link{% if request.endpoint in ['main.rekapitulasi_presensi', 'main.detail_rekapitulasi_presensi'] %} active{% endif %}" href="{{ url_for('main.rekapitulasi_presensi') }}">
                <i class="bi bi-bar-chart-line me-2"></i>Rekapitulasi
            </a>
            <a class="nav-link{% if request.endpoint == 'main.laporan_presensi' %} active{% endif %}" href="{{ url_for('main.laporan_presensi') }}">
                <i class="bi bi-file-text me-2"></i>Laporan
            </a>
        </nav>
    </div>
    <div class="mt-auto p-4 border-top border-light border-opacity-10">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle me-2 fs-5"></i>
                <span class="fw-medium">{{ session.username or 'Admin' }}</span>
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item text-danger" href="{{ url_for('main.logout') }}">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a></li>
            </ul>
        </div>
    </div>
</div>
